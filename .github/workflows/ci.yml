name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: learning_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub -d learning_hub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5432/learning_hub?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @hub/shared build
      - run: pnpm typecheck
      - run: pnpm test
      # Migrations must apply cleanly to an empty database; the seed must run on top.
      - run: pnpm --filter @hub/api exec prisma migrate deploy
      - run: pnpm --filter @hub/api prisma:seed
      - run: pnpm build
