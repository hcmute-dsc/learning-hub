name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: learning_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub -d learning_hub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5432/learning_hub?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Corepack ships with Node and installs the pnpm version pinned in package.json
      # (`packageManager`), so no third-party setup action has to be kept up to date.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter "./packages/*" build
      - run: node packages/content/dist/cli.js content-example
      - run: pnpm typecheck
      - run: pnpm test
      # Migrations must apply cleanly to an empty database; the seed must run on top.
      - run: pnpm --filter @hub/api exec prisma migrate deploy
      - run: pnpm --filter @hub/api prisma:seed
      - run: pnpm build
      # Sync + publish the example content twice: the second run must be a no-op.
      - run: pnpm --filter @hub/api content:sync -- --publish
      - run: pnpm --filter @hub/api content:sync -- --publish
