name: Deploy

# After CI passes on main: build the Docker images, push them to GHCR, then (once the
# VPS is set up) update the containers on the VPS over SSH. Runbook: deploy/README.md.
#
# The SSH step runs only when the repository variable DEPLOY_ENABLED is "true", so the
# images are built and checked from day one, before the VPS secrets exist.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual run from the Actions tab, e.g. to redeploy after changing the VPS .env.
  # Only a run started on main deploys (see the guards on the jobs below).
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at the same time; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The commit CI tested (workflow_run) or the branch head (manual run)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ghcr.io/hcmute-dsc

jobs:
  images:
    # Deploy only what was pushed to main of this repository and passed CI, or a manual
    # run started on main. The `branches` filter above matches by branch name only, so the
    # event, repository and branch are checked here too. scripts/deploy-guards.test.mjs
    # fails if one of these checks is removed (learning-hub#98).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learning-hub-${{ matrix.app }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/learning-hub-${{ matrix.app }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    # The same guard as the images job, repeated so this job never runs on its own.
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://learn.hcmute-dsc.io.vn
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the job refuses to talk to a server that is not our VPS.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Short connect timeout and a few attempts: the runner -> VPS connection sometimes
          # times out once (learning-hub#63). Keep-alives catch a connection that hangs.
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  ConnectTimeout 20\n  ConnectionAttempts 3\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' \
            '${{ secrets.VPS_HOST }}' '${{ secrets.VPS_USER }}' '${{ secrets.VPS_PORT || 22 }}' > ~/.ssh/config

      - name: Wait for SSH
        # Up to 6 rounds of 3 connection attempts, 15 s apart (about 7 minutes at worst).
        # Only the connection is retried; the restart below runs once.
        run: |
          for i in $(seq 1 6); do
            ssh vps true && exit 0
            echo "::warning::SSH to the VPS failed (round $i of 6), retrying in 15 s"
            sleep 15
          done
          echo "::error::Cannot reach the VPS over SSH"
          exit 1

      - name: Copy compose file and backup scripts
        # Copying the same files again is harmless, so this step may retry.
        run: |
          for i in 1 2 3; do
            scp deploy/docker-compose.prod.yml deploy/backup.sh deploy/offsite-export.sh deploy/offsite-serve.sh vps:/opt/learning-hub/ && exit 0
            echo "::warning::scp failed (try $i of 3), retrying in 15 s"
            sleep 15
          done
          exit 1

      - name: Pull images and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The job token can read the images only while this job runs, and the VPS logs
        # out right after pulling, so no long-lived registry password is stored there.
        run: |
          printf '%s' "$TOKEN" | ssh vps "set -e
            cd /opt/learning-hub
            chmod +x backup.sh offsite-export.sh offsite-serve.sh
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Remember the running version in .env, so every later command on the VPS
            # (logs, content sync, a manual restart) uses the same images.
            sed -i '/^IMAGE_TAG=/d' .env && echo 'IMAGE_TAG=${{ env.SHA }}' >> .env
            docker compose -f docker-compose.prod.yml pull
            docker logout ghcr.io
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait
            # Remove older Learning Hub images (~1 GB per version) that no container uses,
            # or the shared VPS disk fills up after a few dozen deploys. The label filter
            # keeps this away from other sites' images. Old versions stay on GHCR.
            docker image prune -af --filter 'label=org.opencontainers.image.source=https://github.com/${{ github.repository }}'
            docker compose -f docker-compose.prod.yml ps"

      - name: Check the site answers
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null https://learn.hcmute-dsc.io.vn/ && exit 0
            sleep 6
          done
          echo "::error::https://learn.hcmute-dsc.io.vn/ does not answer after the deploy"
          exit 1
