# Production stack on the club VPS (runbook: deploy/README.md).
# The deploy workflow copies this file to /opt/learning-hub, writes IMAGE_TAG=<commit sha>
# into /opt/learning-hub/.env and runs `docker compose -f docker-compose.prod.yml up -d`.
# Secrets live only in that .env on the VPS (template: deploy/.env.example).
#
# The club VPS already runs Traefik (in Docker, network `edge`, Let's Encrypt through
# Cloudflare). Only the web container joins `edge`, and its labels tell Traefik to send
# learn.hcmute-dsc.io.vn to it over HTTPS. No port is published on the VPS; the API and
# the database stay on this stack's own network, out of reach of the other sites there.
# Without Traefik: drop the labels and the `edge` network and publish
# '127.0.0.1:3100:3000' instead (examples for Caddy/Nginx in deploy/proxy/).

name: learning-hub

x-api-image: &api-image ghcr.io/hcmute-dsc/learning-hub-api:${IMAGE_TAG:?IMAGE_TAG is written to .env by the deploy workflow}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: learning_hub
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d learning_hub']
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once per deploy, before the new API starts. A failed migration stops the deploy
  # and the old containers keep running.
  migrate:
    image: *api-image
    env_file: .env
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: *api-image
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
        # The web image calls the API by this name (API_INTERNAL_URL in apps/web/Dockerfile).
        # Not plain "api": the web container is also on the shared `edge` network, where
        # another site's container already answers to "api" (found on the first deploy).
        aliases: [learning-hub-api]

  web:
    image: ghcr.io/hcmute-dsc/learning-hub-web:${IMAGE_TAG:?IMAGE_TAG is written to .env by the deploy workflow}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [default, edge]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: edge
      traefik.http.routers.learning-hub.rule: Host(`learn.hcmute-dsc.io.vn`)
      traefik.http.routers.learning-hub.entrypoints: websecure
      traefik.http.routers.learning-hub.tls: 'true'
      traefik.http.routers.learning-hub.tls.certresolver: letsencrypt
      traefik.http.routers.learning-hub.middlewares: learning-hub-gz@docker,learning-hub-hsts@docker
      traefik.http.middlewares.learning-hub-gz.compress: 'true'
      traefik.http.middlewares.learning-hub-hsts.headers.stsSeconds: '31536000'
      traefik.http.services.learning-hub.loadbalancer.server.port: '3000'

networks:
  # Traefik's network, created outside this stack
  edge:
    external: true

volumes:
  db-data:
